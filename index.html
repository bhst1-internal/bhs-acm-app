<style>

  #acm-root{--ink:#1f2937;--ink-light:#374151;--paper:#ffffff;--line:#e5e7eb;--line-dark:#9ca3af;--accent:#2563eb;--accent-2:#1d4ed8;--bg:#f3f4f6;--input-bg:#f9fafb;--text-sec:#6b7280;--ok:#059669;--warn:#d97706;--crit:#dc2626;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:0;min-height:100%;font-size:.875rem;line-height:1.4;position:relative}

  #acm-root .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  #acm-root .brand{display:flex;flex-direction:column;gap:2px}
  #acm-root .brand .k{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-sec);font-weight:700}
  #acm-root .brand .t{font-size:1.125rem;font-weight:800;color:var(--ink)}
  #acm-root .tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:10px}
  #acm-root .tab-btn{border:none;background:transparent;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:600;color:var(--text-sec);cursor:pointer;transition:all .15s}
  #acm-root .tab-btn.active{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  #acm-root .tab-btn:hover:not(.active){color:var(--ink)}
  #acm-root .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .kpi-grid{grid-template-columns:repeat(2,1fr)}}
  #acm-root .kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:visible}
  #acm-root .kpi-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px}
  #acm-root .kpi-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sec);font-weight:700}
  #acm-root .kpi-value{font-size:1.5rem;font-weight:800;color:var(--ink);line-height:1;margin-top:2px}
  #acm-root .kpi-sub{font-size:.75rem;color:var(--text-sec)}
  #acm-root .kpi-pill{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:999px;width:fit-content;margin-top:2px}
  #acm-root .pill-ok{background:#d1fae5;color:var(--ok)}
  #acm-root .pill-warn{background:#fef3c7;color:var(--warn)}
  #acm-root .pill-crit{background:#fee2e2;color:var(--crit)}
  #acm-root .dd-wrapper{position:relative;width:100%;margin-top:4px}
  #acm-root .dd-btn{width:100%;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);font-size:.75rem;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  #acm-root .dd-btn::after{content:"▼";font-size:.55rem;margin-left:6px;color:var(--line-dark)}
  #acm-root .dd-menu{display:none;position:absolute;top:100%;left:0;width:100%;max-height:200px;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:7px;z-index:100;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-top:4px}
  #acm-root .dd-menu.open{display:flex;flex-direction:column;gap:6px}
  #acm-root [data-tooltip]{position:relative;cursor:help}
  #acm-root [data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:6px 10px;border-radius:6px;font-size:.75rem;white-space:nowrap;z-index:100;margin-bottom:8px;pointer-events:none;font-weight:500;text-transform:none;box-shadow:0 4px 6px rgba(0,0,0,.1)}
  #acm-root [data-tooltip]:hover::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#111827;margin-bottom:-2px;pointer-events:none;z-index:100}
  #acm-root .charts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .charts-grid{grid-template-columns:minmax(0,1fr)}}
  #acm-root .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;overflow:hidden}
  #acm-root .panel h3{margin:0 0 10px;font-size:.875rem;font-weight:800;color:var(--ink)}
  #acm-root .panel .hint{font-size:.75rem;color:var(--line-dark);margin-bottom:8px}
  #acm-root .table-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  #acm-root table.list{width:100%;border-collapse:collapse}
  #acm-root table.list th,#acm-root table.editrows th{text-align:left;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sec);background-color:var(--input-bg);padding:6px 8px;border-bottom:2px solid var(--line)}
  #acm-root table.list td,#acm-root table.editrows td{font-size:.7rem;color:var(--ink-light);padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  #acm-root table.list tr:hover td{background:var(--input-bg)}
  #acm-root .status-chip{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block}
  #acm-root .chip-open{background:#e5e7eb;color:var(--text-sec)}
  #acm-root .chip-progress{background:#fef3c7;color:var(--warn)}
  #acm-root .chip-done{background:#d1fae5;color:var(--ok)}
  #acm-root .link-btn{border:none;background:none;color:var(--accent);font-weight:700;font-size:.75rem;cursor:pointer;padding:2px 4px}
  #acm-root .empty-state{text-align:center;padding:34px 10px;color:var(--text-sec);font-size:.875rem}
  #acm-root .form-shell{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px 24px}
  #acm-root .form-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  #acm-root .form-toolbar .rec-select{display:flex;align-items:center;gap:8px;font-size:.875rem}
  #acm-root select.recpick{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;background:var(--input-bg);color:var(--ink);font-family:ui-monospace,monospace}
  #acm-root .btn{border:none;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .btn-primary{background:var(--accent);color:#fff}
  #acm-root .btn-primary:hover{background:var(--accent-2)}
  #acm-root .btn-ghost{background:var(--line);color:var(--ink-light)}
  #acm-root .btn-ghost:hover{background:#d1d5db}
  #acm-root .btn-danger{background:#fee2e2;color:var(--crit)}
  #acm-root .btn-danger:hover{background:#fca5a5}
  #acm-root .btn-solid-danger{background:var(--crit);color:#fff}
  #acm-root .btn-solid-danger:hover{background:#b91c1c}
  #acm-root .btn-row{display:flex;gap:8px}
  #acm-root .btn-export-excel{background-color:var(--ok);color:#ffffff;font-size:.875rem;font-weight:700;padding:8px 16px;border-radius:4px;border:none;cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.05);display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
  #acm-root .btn-export-excel:hover{background-color:#047857}
  #acm-root .btn-export-excel svg{width:16px;height:16px}
  #acm-root .sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;transition:all .2s}
  #acm-root .sec>.sec-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:10px}
  #acm-root .grid{display:grid;gap:10px}
  #acm-root .g2{grid-template-columns:1fr 1fr}
  #acm-root .g3{grid-template-columns:1fr 1fr 1fr}
  #acm-root .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  #acm-root .g5{grid-template-columns:repeat(5,1fr)}
  #acm-root .g6{grid-template-columns:repeat(6,1fr)}

  #acm-root #acm-modal-title{font-size:1rem;font-weight:800;color:var(--ink);margin-bottom:8px}
  #acm-root #acm-modal-msg{font-size:.875rem;color:var(--ink-light);margin-bottom:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  #acm-root #acm-modal-input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:18px;font-size:.875rem;font-family:inherit;color:var(--ink);background:var(--input-bg);outline:none;display:none}
  #acm-root #acm-modal-input:focus{border-color:var(--accent)}
  #acm-root #acm-modal-actions{display:flex;justify-content:flex-end;gap:8px}
  #acm-root .doc-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
  #acm-root .doc-scroll{overflow-x:auto;overflow-y:auto;background:var(--line);padding:24px 12px;border-radius:12px;max-height:calc(100vh - 140px)}

  #acm-root .doc-page td,#acm-root .doc-page th{border:1px solid #000;padding:3px 5px;vertical-align:top;font-size:11px}
  #acm-root .doc-header-title{font-size:17px;font-weight:700;margin:0 0 2px}
  #acm-root .doc-header-sub{font-size:12px;margin:0 0 10px}
  #acm-root .doc-memo-title{font-size:13px;font-weight:700;font-style:italic;margin:4px 0 8px}
  #acm-root .doc-box-x{text-align:center;vertical-align:middle;font-weight:800;height:16px}
  #acm-root .doc-italic-bold{font-style:italic;font-weight:700}

  #acm-root .doc-footer-code{text-align:right;font-size:10px;margin-top:8px}
  .tc{text-align:center} .vm{vertical-align:middle} .b{font-weight:700} 
  @media print{

    #acm-root .topbar,#acm-root .doc-toolbar,#acm-modal-overlay{display:none!important}
    #acm-root .wrap{padding:0!important;margin:0!important;max-width:none!important}
    #acm-root .doc-scroll{padding:0!important;background:transparent!important;overflow:visible!important;max-height:none!important}
    #acm-root .doc-page{box-shadow:none!important;margin:0!important;padding:0!important;page-break-after:avoid}
    #acm-root .doc-footer-code{position:fixed!important;bottom:5mm!important;right:10mm!important}
  }
</style>

  function getNextReportNo() {
    const prefix = `${String(new Date().getFullYear()).slice(-2)}${String(new Date().getMonth() + 1).padStart(2, '0')}-`;
    let max = 0;
    state.records.forEach(rec => { if (rec.reportNo && rec.reportNo.startsWith(prefix)) { const num = parseInt(rec.reportNo.split('-')[1], 10); if (!isNaN(num) && num > max) max = num; } });

  }

  function fmtDate(r) { if (r.happeningDate) { const p = String(r.happeningDate).substring(0, 10).split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0].slice(-2)}`; } return (!r.dd && !r.mm && !r.yy) ? '—' : `${(r.dd||'--').padStart(2,'0')}/${(r.mm||'--').padStart(2,'0')}/${r.yy||'--'}`; }
  function getTs(iso) { if (iso && typeof iso === 'string') { const p = iso.split('-'); if (p.length === 3) return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2])).getTime(); } return null; }
  function getOldTs(dd, mm, yy) { return (!dd || !mm || !yy) ? null : new Date(parseInt(yy.length === 2 ? ('20' + yy) : yy), parseInt(mm)-1, parseInt(dd)).getTime(); }
  function getExactTs(dateStr, oldDd, oldMm, oldYy, timeStr) {

    if (t && timeStr && typeof timeStr === 'string') { const parts = timeStr.split(':'); if (parts.length >= 2) t += ((parseInt(parts[0], 10) || 0) * 3600000) + ((parseInt(parts[1], 10) || 0) * 60000); }
    return t;
  }

  function getStatus(r) {
    const wordCount = str => (str || '').trim().split(/\s+/).filter(w => w.length > 0).length;
    let agBase = r.actGroup || '', actGroupValid = agBase.toUpperCase().startsWith('VENDOR') ? agBase.substring(6).replace(/^:\s*/, '').trim().length > 0 : agBase.trim() !== '';
    const hasActionDate = checkReq(r.actionDate) || (checkReq(r.actDd) && checkReq(r.actMm) && checkReq(r.actYy));
    const actionComplete = hasActionDate && checkReq(r.actDoneBy) && actGroupValid && checkReq(r.actStartTime) && checkReq(r.actEndTime) && checkReq(r.actionCat) && wordCount(r.actionDetail) >= 2;

  function computeKPIs(activeRecs) {
    activeRecs = activeRecs || state.records.filter(r => !r.isDraft);
    const open = activeRecs.filter(r => getStatus(r) !== 'done'), completed = activeRecs.filter(r => getStatus(r) === 'done');
    let resTimes = [], catCounts = {}, ratedTotal = 0, onTime = 0;
    Object.keys(CATS).forEach(k => catCounts[CATS[k]] = 0); Object.keys(CATS2).forEach(k => catCounts[CATS2[k]] = 0);
    activeRecs.forEach(r => {
      if(r.cat1) Object.keys(CATS).forEach(k => { if(r.cat1[k]) catCounts[CATS[k]]++; });
      if(r.cat2) Object.keys(CATS2).forEach(k => { if(r.cat2[k]) catCounts[CATS2[k]]++; });

    completed.forEach(r => {
      const t0 = getExactTs(r.happeningDate, r.dd, r.mm, r.yy, r.timeOfHappening);
      const t1 = getExactTs(r.actionDate, r.actDd, r.actMm, r.actYy, r.actEndTime);
      if(t0 && t1 && t1 >= t0) resTimes.push((t1 - t0) / 86400000);

    });
    let topCat = null, topCatCount = 0;
    Object.entries(catCounts).forEach(([k,v]) => { if(v > topCatCount) { topCat = k; topCatCount = v; } });
    return { total: activeRecs.length, openCount: open.length, completedCount: completed.length, avgRes: resTimes.length ? (resTimes.reduce((a,b)=>a+b,0)/resTimes.length) : null, criticalPending: open.filter(r => r.urgency === 'veryCritical' || r.urgency === 'within24hrs').length, topCat, topCatCount, onTimeRate: ratedTotal ? Math.round((onTime/ratedTotal)*100) : null, catCounts };
  }

    container.querySelector('#acm-doc-recpick').addEventListener('change', async (e) => {

  function render() {
    ROOT.innerHTML = `<div class="wrap"><div class="topbar"><div class="brand"><div class="k">KLIA - Baggage Handling System T1</div><div class="t">BHS Operation & Maintenance Action Memo (ACM)</div></div><div class="tabs"><button class="tab-btn ${state.tab==='dashboard'?'active':''}" data-tab="dashboard">Dashboard</button><button class="tab-btn ${state.tab==='input'?'active':''}" data-tab="input">Memo Details</button><button class="tab-btn ${state.tab==='document'?'active':''}" data-tab="document">Memo View</button></div></div><div id="acm-content"></div></div>`;
    ROOT.querySelectorAll('.tab-btn').forEach(b => {
      b.addEventListener('click', async () => { 
        const targetTab = b.getAttribute('data-tab');
        if (state.tab === 'input' && targetTab !== 'input' && state.isDirty) { const discard = await showModal("Unsaved Changes Detected", "You have entered or modified data that has not been submitted yet.\n\nPlease click \"Submit ✔\" to record your data, or click \"Discard Data\" to abandon your recent changes.", "unsaved"); if (!discard) return; revertActiveRecord(); }
        state.tab = targetTab; render(); 
      });
    });
    const content = document.getElementById('acm-content');
    if (!state.loaded) { content.innerHTML = `<div class="empty-state">Loading records…</div>`; return; }
    if (state.tab === 'dashboard') renderDashboard(content);
    else if (state.tab === 'input') renderInput(content);
    else renderDocument(content);
  }

  render();
  loadRecords();
})();
